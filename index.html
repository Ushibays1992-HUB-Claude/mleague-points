<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mリーグポイント集計ページ</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon_32-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/favicon/favicon_48-48.png" sizes="48x48">
<link rel="icon" type="image/png" href="assets/favicon/favicon_64-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/favicon/favicon_64-64.png" sizes="64x64">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header class="site-header">
  <h1>Mリーグポイント集計ページ</h1>
  <p class="updated" id="updated-at">読み込み中...</p>
</header>

<main>
  <section class="board" id="board-purpose1">
    <h2>① 選手指名ポイントランキング</h2>
    <div class="table-wrap">
      <table id="table-purpose1"></table>
    </div>
  </section>

  <section class="chart-section">
    <h2>ポイント推移（①選手指名）</h2>
    <div class="chart-wrap"><canvas id="chart-purpose1"></canvas></div>
  </section>

  <section class="board" id="board-purpose2">
    <h2>② チーム指名ポイントランキング</h2>
    <div class="table-wrap">
      <table id="table-purpose2"></table>
    </div>
  </section>

  <section class="chart-section">
    <h2>順位変動（②チーム指名）</h2>
    <div class="chart-wrap"><canvas id="chart-purpose2"></canvas></div>
  </section>

  <p class="empty-state" id="empty-state" hidden>
    まだ記録がありません。毎日13:17にスクレイピングが実行され、シーズン開幕後に順次データが蓄積されます。
  </p>
</main>

<footer class="site-footer">
  <p>データ取得元: <a href="https://m-league.jp/stats" target="_blank" rel="noopener noreferrer">m-league.jp/stats</a>（レギュラーシーズン）</p>
  <p>毎日13:17にスクレイピングし、前日から変化があった日のみ履歴に記録しています。</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
