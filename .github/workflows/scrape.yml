name: Scrape M.League points

on:
  schedule:
    - cron: "17 4 * * *" # 13:17 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/scrape.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/history.json data/latest_player_points.json; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest_player_points.json
          git commit -m "chore: update points history $(date -u +%Y-%m-%d)"
          git push
